[project]
name = "pachamama-api"
version = "0.1.0"
description = "API d'acces neutre a la base talent unifiee de Pachamama"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.38",
    "asyncpg>=0.30",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "asyncpg-stubs>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pachamama_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Un jeu volontairement resserre : les regles qui attrapent de vrais defauts,
# pas celles qui produisent du bruit. S = bandit (securite), ASYNC = pieges
# asynchrones, B = bugbear.
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "C4", "SIM", "RUF"]
ignore = ["E501"]  # la longueur est deja geree par le formateur

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # assert et secrets factices sont legitimes en test

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = []

[[tool.mypy.overrides]]
# asyncpg fournit ses stubs via asyncpg-stubs ; la surcharge reste utile si
# le paquet est absent d'un environnement.
module = "asyncpg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
