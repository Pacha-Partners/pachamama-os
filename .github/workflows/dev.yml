# ════════════════════════════════════════════════════════════════════════
# APRÈS FUSION DANS `dev` — les migrations partent sur le projet de DEV,
# puis les six harnais tournent contre lui.
#
# ⚠ C'EST ICI QUE LES SECRETS ENTRENT, ET NULLE PART AILLEURS. Une pull
# request peut venir de n'importe où ; une fusion dans `dev` est un acte
# de quelqu'un qui a le droit d'écrire. Les identifiants du projet de dev
# ne sont donc jamais exposés à `ci.yml`.
#
# ⚠ `db push` SANS `--include-all`, DÉLIBÉRÉMENT. Le drapeau désarmerait le
# garde qui refuse une migration datée AVANT la dernière appliquée — le cas
# exact que produit un hotfix passé par `main`. S'il tombe ici, c'est un
# signal qui demande une décision humaine, pas un drapeau à ajouter une fois
# pour toutes. Mesuré : le CLI rend `LegacyDbPushMissingRemoteError` et
# nomme les fichiers concernés.
# ════════════════════════════════════════════════════════════════════════
name: Dev

on:
  push:
    branches: [dev]

concurrency:
  group: dev
  cancel-in-progress: false

jobs:
  migrations:
    name: Migrations → projet dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      # ⚠ UN ÉCHEC QUI SE LIT. Sans ce garde, un secret absent produit une
      # erreur du CLI Supabase sur `link` — illisible, et qui envoie chercher
      # la panne du mauvais côté. Voir CONTRIBUTING.md §6.
      - name: Les secrets attendus sont-ils posés ?
        run: |
          manque=""
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF_DEV SUPABASE_DB_PASSWORD_DEV; do
            [ -z "${!v:-}" ] && manque="$manque $v"
          done
          if [ -n "$manque" ]; then
            echo "::error::Secrets absents :$manque"
            echo "Les poser avec : bash outils/secrets_ci.sh  (voir CONTRIBUTING.md §6)"
            exit 1
          fi
          echo "Tous les secrets attendus sont présents."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF_DEV: ${{ secrets.SUPABASE_PROJECT_REF_DEV }}
          SUPABASE_DB_PASSWORD_DEV: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}
      - run: supabase link --project-ref "$PROJET"
        env:
          PROJET: ${{ secrets.SUPABASE_PROJECT_REF_DEV }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}
      - run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}

  harnais:
    name: Les six harnais contre le projet dev
    needs: migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Les harnais lisent `.env.local` par `node --env-file`. On le fabrique
      # depuis les secrets, et il n'existe que le temps du job.
      - name: Fabriquer .env.local depuis les secrets
        working-directory: frontend
        run: |
          cat > .env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL_DEV }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY_DEV }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY_DEV }}
          TEST_MDP=${{ secrets.TEST_MDP }}
          TEST_ENTREPRISE_EMAIL=${{ secrets.TEST_ENTREPRISE_EMAIL }}
          TEST_TALENT_EMAIL=${{ secrets.TEST_TALENT_EMAIL }}
          TEST_RECRUTEUR_EMAIL=${{ secrets.TEST_RECRUTEUR_EMAIL }}
          EOF
      - run: npm run verifier:j1
        working-directory: frontend
      - run: npm run verifier:j2
        working-directory: frontend
      - run: npm run verifier:j3
        working-directory: frontend
      - run: npm run verifier:j4
        working-directory: frontend
      # Les deux harnais d'écrans exigent l'application en marche : ils
      # interrogent des URL, pas seulement la base.
      # Les deux harnais d'écrans interrogent des URL, pas seulement la base :
      # il leur faut l'application en marche. `localhost:3000` est leur défaut.
      - name: Lancer l'application, puis les harnais d'écrans
        working-directory: frontend
        run: |
          npx next build
          npx next start &
          # Attente active plutôt qu'un paquet de plus : trente essais d'une
          # seconde, et un échec explicite si le serveur ne répond jamais.
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/offres && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:3000/offres || { echo "l'application n'a pas démarré"; exit 1; }
          npm run verifier:j3-ecrans
          npm run verifier:j4-ecrans
